<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Accent Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .bg-box { fill: url(#bg-grad); rx: 16px; }
    .border-glow { stroke: rgba(129, 140, 248, 0.35); stroke-width: 1.5; fill: none; rx: 16px; }
    
    /* Background animated elements */
    .pulse-circle {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .orbit-node {
      animation: float-slow 6s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 8, 8;
      animation: dash 20s linear infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.25; transform: scale(0.96); }
      100% { opacity: 0.65; transform: scale(1.04); }
    }
    @keyframes float-slow {
      0% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-8px) translateX(4px); }
      100% { transform: translateY(6px) translateX(-4px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }

    /* Typography */
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#title-grad);
      letter-spacing: -0.5px;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #cbd5e1;
    }
    .feature-tag {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 13px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" class="bg-box" />
  <rect width="1200" height="340" fill="url(#grid)" rx="16" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (Keep behind text) -->
  <g opacity="0.6">
    <!-- Glow Orbs in Corners and Background -->
    <circle cx="150" cy="80" r="130" fill="#38bdf8" opacity="0.08" filter="url(#glow)" class="pulse-circle" />
    <circle cx="1060" cy="220" r="160" fill="#818cf8" opacity="0.1" filter="url(#glow)" class="pulse-circle" style="animation-delay: -2s;" />
    <circle cx="620" cy="280" r="100" fill="#c084fc" opacity="0.07" filter="url(#glow)" class="pulse-circle" style="animation-delay: -1s;" />

    <!-- Animated Data Flow Lines -->
    <path d="M 60 270 C 260 210, 420 310, 680 250 S 980 180, 1140 260" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2" class="flow-line" />
    <path d="M 80 90 C 320 160, 500 70, 780 130 S 1000 70, 1120 110" fill="none" stroke="rgba(129, 140, 248, 0.2)" stroke-width="1.5" class="flow-line" style="animation-direction: reverse; animation-duration: 25s;" />

    <!-- Scientific Graph Nodes & Constellations (in background) -->
    <g class="orbit-node">
      <circle cx="1020" cy="90" r="5" fill="#38bdf8" filter="url(#subtle-glow)" />
      <circle cx="1080" cy="130" r="7" fill="#818cf8" filter="url(#subtle-glow)" />
      <circle cx="1130" cy="80" r="4" fill="#c084fc" filter="url(#subtle-glow)" />
      <line x1="1020" y1="90" x2="1080" y2="130" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1.5" />
      <line x1="1080" y1="130" x2="1130" y2="80" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1.5" />
    </g>

    <g class="orbit-node" style="animation-delay: -3s;">
      <circle cx="80" cy="180" r="6" fill="#818cf8" filter="url(#subtle-glow)" />
      <circle cx="140" cy="220" r="4" fill="#38bdf8" filter="url(#subtle-glow)" />
      <line x1="80" y1="180" x2="140" y2="220" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />
    </g>
  </g>

  <!-- FOREGROUND: TITLE, SUBTITLE & LABELS (Unobstructed & Prominent) -->
  <g transform="translate(60, 0)">
    <!-- Category Pill Tag -->
    <g transform="translate(0, 48)">
      <rect width="250" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#38bdf8" />
      <text x="28" y="19" class="badge-label">Curated AI Research Ecosystem</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" class="title-text">Awesome AI Research Tools</text>

    <!-- Subtitle -->
    <text x="0" y="174" class="subtitle-text">Empowering Scientific Literature Discovery, Autonomous Synthesis &amp; Peer Review</text>

    <!-- Capability Feature Badges / Highlights -->
    <g transform="translate(0, 222)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <rect width="210" height="42" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="18" y="26" class="feature-tag">🔍 Literature Discovery</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(225, 0)">
        <rect width="220" height="42" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="18" y="26" class="feature-tag">🤖 Autonomous Agents</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(460, 0)">
        <rect width="220" height="42" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="18" y="26" class="feature-tag">📊 Citation Graph RAG</text>
      </g>
      <!-- Item 4 -->
      <g transform="translate(695, 0)">
        <rect width="230" height="42" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="18" y="26" class="feature-tag">📝 Manuscript &amp; Review</text>
      </g>
    </g>

    <!-- Bottom Metadata / Info -->
    <text x="0" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b">
      ⚡ Tracking Top SaaS Platforms &amp; Star-Ranked Open-Source Projects • Updated 2026
    </text>
  </g>

  <!-- Outer Border Stroke -->
  <rect width="1198" height="338" x="1" y="1" class="border-glow" />
</svg>
